name: Daily Flight Check
on:
  schedule:
    - cron: '43 23 * * *'  # UTC 23:43 (北京时间 07:43)
    - cron: '43 5 * * *'   # UTC 05:43 (北京时间 13:43)
    - cron: '43 12 * * *'  # UTC 12:43 (北京时间 20:43)
  workflow_dispatch:       # 允许手动测试

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run check script
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python main.py
